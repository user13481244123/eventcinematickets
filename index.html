<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Ticket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #72b626;
      margin: 0;
      padding: 10px;
    }

    .ticket {
      background: #e2221a;
      color: white;
      border-radius: 12px;
      padding: 16px;
      max-width: 340px;
      margin: 0 auto;
      text-align: center;
    }

    .ticket h1 {
      font-size: 20px;
      margin: 0;
    }

    .ticket h2 {
      font-size: 16px;
      margin: 8px 0;
    }

    .label {
      background: white;
      color: black;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      margin: 16px 0;
    }

    .label div {
      margin-top: 6px;
      font-size: 14px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 14px 0;
      font-size: 14px;
    }

    .footer {
      font-size: 12px;
      margin-top: 10px;
    }

    h3 {
      font-size: 14px;
      margin-top: 18px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-direction: column;
    }

    .action-box {
      background: #fff;
      color: black;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #ddd;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      padding: 6px 0;
      font-size: 10px;
    }

    .nav-item {
      text-align: center;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="ticket">
    <h1>EVENT</h1>
    <div>EVENT | ORIGINAL</div>
    <h2>Until Dawn <span style="background: white; color: red; padding: 1px 4px; border-radius: 4px;">MA15+</span></h2>

    <div class="label">
      PROCEED TO<br>CINEMA 3
      <div>&#128100; × 1</div>
    </div>

    <div class="info-row">
      <div><strong>Cinema</strong><br>3</div>
      <div><strong>Seat</strong><br>K4</div>
      <div><strong>Time</strong><br>3:30PM</div>
    </div>

    <div class="footer">
      Thu 1 May<br>
      Event Cinemas George Street<br>
      1x Student
    </div>

    <h3>MORE ACTIONS</h3>

    <div class="actions">
      <div class="action-box">ADD TO MOBILE WALLET</div>
      <div class="action-box">VIEW QR CODE</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">home</div>
    <div class="nav-item">movies</div>
    <div class="nav-item">book</div>
    <div class="nav-item">food & drink</div>
    <div class="nav-item">more</div>
  </div>

</body>
</html>
