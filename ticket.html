<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Ticket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #72b626;
      margin: 0;
      padding: 20px;
    }

    .ticket {
      background: #e2221a;
      color: white;
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }

    .ticket h1 {
      margin: 0;
      font-size: 24px;
    }

    .label {
      background: white;
      color: black;
      margin: 20px auto;
      padding: 15px;
      width: 70%;
      border-radius: 10px;
      font-weight: bold;
    }

    .info-row {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .info-column {
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
    }

    .actions {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
    }

    .action-box {
      background: #fff;
      color: black;
      padding: 15px;
      width: 45%;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #ddd;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }

    .nav-item {
      text-align: center;
      font-size: 12px;
    }

    .topnav {
        background-color: #333;
        overflow: hidden;
    }
  </style>
</head>
<body>

    <div class="topnav">

    </div>
  <div class="ticket">
    <img src="event-logo.png" height="40px"></img>
    <h1>EVENT | ORIGINAL</h1>
    <h2>Until Dawn <span style="background: white; color: red; padding: 2px 5px; border-radius: 4px;">MA15+</span></h2>

    <div class="label">
      PROCEED TO<br>CINEMA 3<br>
      <div style="margin-top: 10px;">&#128100; × 1</div>
    </div>

    <div class="info-row">
      <div class="info-column">
        <div>Cinema</div>
        <strong>3</strong>
      </div>
      <div class="info-column">
        <div>Seat</div>
        <strong>K4</strong>
      </div>
      <div class="info-column">
        <div>Time</div>
        <strong>3:30PM</strong>
      </div>
    </div>

    <div class="footer">
      Thu 1 May<br>
      Event Cinemas George Street<br>
      1x Student
    </div>

    <h3 style="margin-top: 30px;">MORE ACTIONS</h3>

    <div class="actions">
      <div class="action-box">ADD TO MOBILE WALLET</div>
      <div class="action-box">VIEW QR CODE</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">home</div>
    <div class="nav-item">movies</div>
    <div class="nav-item">book</div>
    <div class="nav-item">food & drink</div>
    <div class="nav-item">more</div>
  </div>

</body>
</html>
